<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<style>
  body { font-family: -apple-system, Helvetica Neue, sans-serif; font-size: 13px; color: #1d1d1f; margin: 20px 24px; }
  h2 { font-size: 17px; font-weight: 600; margin: 0 0 12px; }
  p { line-height: 1.6; margin: 0 0 10px; color: #3a3a3c; }
  code { font-family: "SF Mono", Menlo, monospace; font-size: 12px; background: #f5f5f7; padding: 1px 5px; border-radius: 3px; }
  .url { color: #0a84ff; }
</style>
</head>
<body>
  <h2>Installation complete</h2>
  <p>SyncTool is installed and running.</p>
  <p>Open the web interface: <strong class="url">http://localhost:3001</strong></p>
  <p>Useful terminal commands:</p>
  <p>
    <code>synctool status</code> — check if services are running<br/>
    <code>synctool log api</code> — stream the API log<br/>
    <code>synctool open</code> — open web UI in browser<br/>
    <code>synctool uninstall</code> — remove everything
  </p>
</body>
</html>
